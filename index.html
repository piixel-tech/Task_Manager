<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F5F9" />
    <title>Task Manager - Piixel &amp; Unwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // One accent for everyone; drop any accent saved by an older version.
      try {
        localStorage.removeItem('tm.accent');
        // Apply light / dark ("system" follows the device) and compact spacing.
        var m = localStorage.getItem('tm.mode') || 'light';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
        // Colour theme (data-theme), applied before first paint so there is no flash.
        var p = localStorage.getItem('tm.palette');
        var cc = localStorage.getItem('tm.customcss');
        if (/^custom:[0-9a-f]{12,32}$/.test(p) && cc) {
          // A custom theme: its colours were cached by the app, so it paints before the page loads.
          var cs = document.createElement('style');
          cs.id = 'tm-custom-themes-css';
          cs.textContent = cc;
          document.head.appendChild(cs);
          p = 'custom-' + p.slice(7);
        } else if (['purple', 'indigo', 'blue', 'sky', 'teal', 'green', 'red', 'coral', 'pink', 'orange', 'gold', 'brown', 'olive', 'grey', 'monochrome'].indexOf(p) < 0) p = 'purple';
        document.documentElement.setAttribute('data-theme', p);
        // A live festival theme (cached by the app) applies before first paint too, unless this browser switched back.
        try {
          var fc = JSON.parse(localStorage.getItem('tm.festival') || 'null');
          var n = new Date();
          var td = n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2);
          if (fc && fc.css && fc.end >= td && localStorage.getItem('tm.festival.off') !== fc.id) {
            var st = document.createElement('style');
            st.id = 'tm-festival-css';
            st.textContent = fc.css;
            document.head.appendChild(st);
            document.documentElement.setAttribute('data-theme', 'festival');
          }
        } catch (e2) {}
        document.documentElement.setAttribute('data-density', localStorage.getItem('tm.density') || 'comfortable');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
